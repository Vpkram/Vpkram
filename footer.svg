<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.t{font-family:Consolas,Menlo,"Courier New",monospace;font-weight:700;fill:#e9e5ff;text-anchor:middle}
.w1{animation:m1 9s linear infinite}.w2{animation:m2 14s linear infinite}
@keyframes m1{from{transform:translateX(0)}to{transform:translateX(-300px)}}
@keyframes m2{from{transform:translateX(-300px)}to{transform:translateX(0)}}
</style>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<clipPath id="c"><rect width="900" height="140" rx="12"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="900" height="140" fill="#0b1020"/>
<g class="w2" opacity=".35"><path fill="url(#g)" d="M0 60 Q75 30 150 60 T300 60 T450 60 T600 60 T750 60 T900 60 T1050 60 T1200 60 V140 H0Z"/></g>
<g class="w1" opacity=".6"><path fill="url(#g)" d="M0 80 Q75 50 150 80 T300 80 T450 80 T600 80 T750 80 T900 80 T1050 80 T1200 80 V140 H0Z"/></g>
<text class="t" x="450" y="50" font-size="22">Thanks for visiting</text>
<text class="t" x="450" y="78" font-size="14" style="fill:#a78bfa">Let's build something with GenAI</text>
</g>
</svg>
