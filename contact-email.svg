<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
<style>text{font-family:Consolas,Menlo,"Courier New",monospace}
.b{animation:g 3s ease-in-out infinite}@keyframes g{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
.s{animation:s 3.5s linear infinite}@keyframes s{0%{transform:translateX(-80px)}100%{transform:translateX(300px)}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151f45"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#f87171" stop-opacity="0"/><stop offset=".5" stop-color="#f87171" stop-opacity=".25"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect x="2" y="2" width="276" height="60" rx="12"/></clipPath></defs>
<rect class="b" x="2" y="2" width="276" height="60" rx="12" fill="url(#bg)" stroke="#f87171" stroke-width="1.5"/>
<g clip-path="url(#cp)"><rect class="s" x="0" y="0" width="80" height="64" fill="url(#sh)"/></g>
<rect x="14" y="12" width="40" height="40" rx="10" fill="#f87171" fill-opacity=".15" stroke="#f87171" stroke-opacity=".6"/>
<text x="34" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#f87171">@</text>
<text x="66" y="30" font-size="14" font-weight="700" letter-spacing="2" fill="#f1f5f9">EMAIL</text>
<text x="66" y="48" font-size="11" fill="#f87171">vpkram78@gmail.com</text></svg>